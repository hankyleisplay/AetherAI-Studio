name: Build launcher

# Builds AetherLauncher.exe on Windows. Runs when the launcher changes, on version tags, or by hand.
# On a v* tag the executable is also attached to the GitHub Release of that tag.
on:
  push:
    branches:
      - main
      - 'ccr-**'
    paths:
      - 'launcher/**'
      - '.github/workflows/build-launcher.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          node --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: Build
        working-directory: launcher/src-tauri
        run: npx --yes @tauri-apps/cli@^2 build --no-bundle

      - name: Collect executable
        shell: pwsh
        run: |
          $release = "launcher/src-tauri/target/release"
          $exe = Get-ChildItem $release -Filter *.exe -File | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw "No executable found in $release" }
          Write-Host "Built $($exe.Name) ($([math]::Round($exe.Length / 1MB, 2)) MB)"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $exe.FullName out/AetherLauncher.exe
          (Get-FileHash out/AetherLauncher.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii out/AetherLauncher.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AetherLauncher
          path: out/
          if-no-files-found: error

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AetherLauncher
          path: out

      - name: Upload to the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/AetherLauncher.exe --clobber
          else
            gh release create "$TAG" out/AetherLauncher.exe --title "Aether AI Studio $TAG" --generate-notes
          fi
