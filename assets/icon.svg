<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Aether AI Studio app icon: a liquid-glass orb with the hexagonal Aether core, in the same aurora colours as the
       app (cyan #5ee7ff, blue #4f9cff, violet #a78bfa, pink #ff7ab8 over deep navy). Kept free of fine detail so it
       stays readable down to 16 px. Every icon file in the project is generated from this one. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2366" />
      <stop offset="0.55" stop-color="#0d1238" />
      <stop offset="1" stop-color="#080a22" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="8%" r="75%">
      <stop offset="0" stop-color="#4f7dff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#4f7dff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="orb" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#5ee7ff" />
      <stop offset="0.45" stop-color="#4f9cff" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="swirl" x1="1" y1="0.1" x2="0.1" y2="1">
      <stop offset="0" stop-color="#ff7ab8" />
      <stop offset="0.6" stop-color="#a78bfa" />
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="sheen" cx="34%" cy="26%" r="58%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.22" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <clipPath id="orbClip"><circle cx="128" cy="132" r="76" /></clipPath>
  </defs>

  <!-- Squircle base -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)" />
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bgGlow)" />

  <!-- Light spilling from the orb -->
  <circle cx="128" cy="132" r="78" fill="#5ee7ff" opacity="0.35" filter="url(#glow)" />

  <!-- Liquid orb -->
  <circle cx="128" cy="132" r="76" fill="url(#orb)" />
  <g clip-path="url(#orbClip)">
    <path d="M58 150 C70 100 120 92 150 110 C178 127 200 120 214 96 L214 214 L58 214 Z" fill="url(#swirl)" opacity="0.8" />
    <ellipse cx="104" cy="98" rx="56" ry="34" fill="url(#sheen)" transform="rotate(-24 104 98)" />
  </g>
  <circle cx="128" cy="132" r="75" fill="none" stroke="url(#rim)" stroke-width="3" />

  <!-- Aether core -->
  <polygon points="128,92 162,111.5 162,150.5 128,170 94,150.5 94,111.5" fill="none" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" opacity="0.95" />
  <circle cx="128" cy="131" r="16" fill="#ffffff" opacity="0.35" filter="url(#glow)" />
  <circle cx="128" cy="131" r="9.5" fill="#ffffff" />

  <!-- Glass edge of the squircle -->
  <rect x="9.5" y="9.5" width="237" height="237" rx="54.5" fill="none" stroke="url(#rim)" stroke-width="3" />
</svg>
